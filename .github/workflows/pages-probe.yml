# Throwaway diagnostic. The Pages deploy job has been failing in two seconds
# with no steps and no downloadable log, which is what a job rejected before
# dispatch looks like — but "looks like" is not "is". These two jobs are
# identical apart from the environment reference, so whichever way they land
# says which of the two is the blocker. Deleted once it has answered.
name: Pages probe

on: workflow_dispatch

jobs:
  without-environment:
    runs-on: ubuntu-latest
    steps:
      - run: echo "a plain job on this branch runs"

  with-environment:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - run: echo "the github-pages environment let this branch in"
