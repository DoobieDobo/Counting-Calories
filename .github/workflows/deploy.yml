name: Deploy to GitHub Pages

# Publishes the built game to GitHub Pages.
#
# `enablement: true` below turns Pages on and points it at Actions the first
# time this runs, so nobody has to find Settings → Pages by hand — which is a
# genuine obstacle from the GitHub mobile app, where that screen is not exposed.
# It needs the repo to be public (or a paid plan) and the `pages: write`
# permission granted above.
on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # Sets the asset base path to /Counting-Calories/ for project-site hosting.
          GITHUB_PAGES: 'true'

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
