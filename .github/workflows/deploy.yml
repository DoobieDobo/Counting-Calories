name: Deploy to GitHub Pages

# Publishes the built game to GitHub Pages.
#
# ONE-TIME SETUP, and it cannot be done from here. Pages has to be switched on
# for the repo: Settings → Pages → Build and deployment → Source: GitHub Actions.
# Until that is done every run of this workflow fails at configure-pages with
# "Get Pages site failed".
#
# `enablement: true` on configure-pages looks like it would do this
# automatically, and it was tried: the default GITHUB_TOKEN cannot create a
# Pages site ("Resource not accessible by integration"), because creating one
# needs admin rights the token is not granted. It would take a personal access
# token, which is not worth storing for a single switch.
#
# The GitHub mobile app does not expose the Pages screen at all — reach it from
# a desktop browser, or from a phone via github.com with "Desktop site" on.
on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # Sets the asset base path to /Counting-Calories/ for project-site hosting.
          GITHUB_PAGES: 'true'

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
